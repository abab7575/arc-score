name: Scan Staleness Check

# Runs every 6 hours. Fails (and sends a GitHub workflow-failure email to repo
# watchers) if the most recent successful scan completed more than 26 hours ago
# AND the recovery dispatch also fails.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  BASE_URL: https://www.arcreport.ai
  STALE_THRESHOLD_HOURS: 26

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check last scan completion
        run: |
          set -e

          RESPONSE=$(curl -s --max-time 30 "${BASE_URL}/api/scan-health" || true)
          echo "Health response: ${RESPONSE:0:500}"

          # All staleness logic in one python block kept at base indentation —
          # nesting python -c inside shell if-blocks re-indents the source and
          # raises IndentationError (this broke every previous run).
          STALE=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          from datetime import datetime, timezone
          try:
              d = json.load(sys.stdin)
          except Exception:
              print('age=unknown reason=unparseable-health-response', file=sys.stderr)
              print('yes')
              raise SystemExit
          latest = d.get('latestRun') or {}
          completed = (latest.get('completedAt') or '') if latest.get('status') == 'completed' else ''
          if not completed:
              print('age=unknown reason=no-completed-run', file=sys.stderr)
              print('yes')
              raise SystemExit
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(completed.replace('Z', '+00:00'))).total_seconds() / 3600
          print(f'last_completed={completed} age_hours={age:.1f}', file=sys.stderr)
          print('yes' if age > float('${STALE_THRESHOLD_HOURS}') else 'no')
          ")

          if [ "$STALE" = "yes" ]; then
            echo "::warning::Scan is stale or incomplete. Dispatching recovery scan."

            RECOVERY=$(curl -s --max-time 60 -w "\n%{http_code}" -X POST \
              "${BASE_URL}/api/cron/lightweight-scan?concurrency=20" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json")

            RECOVERY_CODE=$(echo "$RECOVERY" | tail -1)
            RECOVERY_BODY=$(echo "$RECOVERY" | head -n -1)

            echo "Recovery status: $RECOVERY_CODE"
            echo "Recovery response: $RECOVERY_BODY"

            if [ "$RECOVERY_CODE" -ne 200 ]; then
              echo "::error::Recovery trigger failed with status $RECOVERY_CODE"
              exit 1
            fi

            echo "✓ Recovery scan dispatched"
            exit 0
          fi

          echo "✓ Scan freshness OK (under ${STALE_THRESHOLD_HOURS}h threshold)"
