name: Public Weekly Digest

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send the public weekly digest
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.arcreport.ai/api/cron/public-weekly-digest"
