name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Seed test database
        run: |
          npx tsx src/lib/db/seed.ts
          for csv in data/*.csv; do
            npx tsx scripts/bulk-import.ts "$csv"
          done
          npx tsx scripts/seed-ci-data.ts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
