name: Agency Weekly Digest

on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send the weekly agency digest
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.arcreport.ai/api/cron/agency-digest"
