name: Agency Campaign Delivery

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver approved agency campaigns
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.arcreport.ai/api/cron/agency-campaigns"
